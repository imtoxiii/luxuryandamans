    /* Mobile optimization - reduce animations on slower devices.
       Excluded: the preloader (choreography needs full-length transitions) and

    @media (max-width: 768px) {
      :not(#loading-skeleton):not(#loading-skeleton *):not(.marquee-track):not(.scroll-cue-dot) {
        animation-duration: 0.5s !important;
        transition-duration: 0.2s !important;

    /* ============================================================
       PRELOADER — "editorial ink" intro screen
       Solid deep-ink stage, masked wordmark reveal, giant counter,
       hairline progress. Exits with a two-tone upward curtain sweep.
       ============================================================ */
    #loading-skeleton {
      position: fixed;
      inset: 0;
      /* Above the site nav (z-index 9999 !important) and floating widgets */
      z-index: 100000;
      overflow: hidden;
      /* Purely visual — the page beneath stays interactive */
      pointer-events: none;
    }

    #loading-skeleton.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* Trailing accent panel (sand) — revealed briefly as the ink panel sweeps up */
    .ldr-shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #f2ece4;
      transform: translateY(0);
    }

    /* Main ink panel — carries all the content */
    .ldr-ink {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(130% 130% at 50% 18%, #0a1a2c 0%, #06121f 52%, #040d17 100%);
      color: #f2ece4;
      transform: translateY(0);
    }

    #loading-skeleton.is-done .ldr-ink {
      transform: translateY(-101%);
      transition: transform 0.9s cubic-bezier(0.83, 0, 0.17, 1) !important;
    }

    #loading-skeleton.is-done .ldr-shade {
      transform: translateY(-101%);
      transition: transform 0.9s cubic-bezier(0.83, 0, 0.17, 1) 0.11s !important;
    }

    /* Second line: outlined type — editorial accent */
    .ldr-line-outline {
      color: transparent;

    }

    @media (max-width: 768px) {

    .ldr-ticker {

    /* --- bottom row: giant counter + caption --- */
    .ldr-bottom {

      transform: translateY(16px);
      transition: opacity 0.7s ease 0.35s, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.35s;
    }

    #loading-skeleton.is-in .ldr-count {
      opacity: 1;
      transform: translateY(0);
    }

    .ldr-count sup {
      font-size: 0.22em;
      letter-spacing: 0.1em;
      vertical-align: super;
      color: rgba(242, 236, 228, 0.45);
    }

    .ldr-caption {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-align: right;
      color: rgba(242, 236, 228, 0.55);
      padding-bottom: 0.5rem;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.7s ease 0.65s, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.65s;
    }

    #loading-skeleton.is-in .ldr-caption {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- hairline progress along the bottom edge --- */
    .ldr-track {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: rgba(242, 236, 228, 0.12);
    }

    .ldr-bar {
      position: absolute;
      inset: 0;
      background: #f2ece4;
      transform: scaleX(0);
      transform-origin: left center;
    }

    /* --- exit: content leaves before the curtain sweep --- */
    #loading-skeleton.is-exiting .ldr-line-inner {
      transform: translateY(-112%) !important;
      transition: transform 0.55s cubic-bezier(0.65, 0, 0.35, 1) !important;
    }

    #loading-skeleton.is-exiting .ldr-line:nth-child(3) .ldr-line-inner {
      transition-delay: 0.06s !important;
    }

    #loading-skeleton.is-exiting .ldr-eyebrow,
    #loading-skeleton.is-exiting .ldr-meta,
    #loading-skeleton.is-exiting .ldr-ticker,
    #loading-skeleton.is-exiting .ldr-caption {
      opacity: 0 !important;
      transition: opacity 0.35s ease !important;
    }

    #loading-skeleton.is-exiting .ldr-count {
      opacity: 0;
      transform: translateY(-14px);
      transition: opacity 0.4s ease 0.1s, transform 0.4s ease 0.1s !important;
    }

    @media (prefers-reduced-motion: reduce) {

      #loading-skeleton *,
      #loading-skeleton {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

        tickerEl.style.opacity = '0';

          if (!tickerEl) return;
          tickerEl.textContent = islands[tickIdx];
          tickerEl.style.opacity = '';

        var n = Math.min(100, Math.max(0, Math.round(v)));

        if (finished) return;
        var t = now - start;

        finished = true;
        cancelAnimationFrame(rafId);

      setTimeout(function () { finish(false); }, 9000);
    })();
  </script>

  <!-- Ensure no stale Service Worker or caches keep old assets -->
  <script>
    (function removeStaleServiceWorkersAndCaches() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations?.().then(function (registrations) {
          if (registrations && registrations.length) {
            Promise.all(registrations.map(function (r) { return r.unregister(); }))
              .then(function () {
                if (window.caches && window.caches.keys) {
                  caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); });
                }
                console.log('🧹 Removed old service workers and cleared caches');
              });
          }
        });
      }
    })();
  </script>
